<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infografía · estilo captura</title>
<!-- Estilo 3 · captura: para herramientas y novedades. Solo la captura, en 16:9 (1920 × 1080).
     Solo hace falta si la captura no viene ya en 16:9: la encaja recortando por abajo. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #d6d3d1; }
  .img { width: 1920px; height: 1080px; margin: 40px auto; background: #ebe8e2; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  @media screen { .img { zoom: .4; } }
  @page { size: 1920px 1080px; margin: 0; }
  @media print { body { background: none; } .img { margin: 0; box-shadow: none; zoom: 1; } }
</style>
</head>
<body>

<section class="img">
  <img src="captura.png" alt="Captura de la herramienta">
</section>

</body>
</html>
